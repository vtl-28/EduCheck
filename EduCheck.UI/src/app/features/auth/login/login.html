<div class="auth-page">

  <!-- Background -->
  <div class="auth-page__bg"></div>

  <!-- Card -->
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-card__logo" (click)="goToLanding()">
      Edu<span>Check</span>
    </div>
    <p class="auth-card__tagline">Verify. Trust. Report.</p>

    <h2 class="auth-card__heading">Welcome back</h2>
    <p class="auth-card__sub">Sign in to your account</p>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email -->
      <div class="field" [class.field--error]="email.invalid && email.touched">
        <label class="field__label" for="email">Email address</label>
        <div class="field__input-wrap">
          <span class="field__icon">✉️</span>
          <input
            id="email"
            class="field__input"
            type="email"
            placeholder="you@example.com"
            formControlName="email"
            autocomplete="email"
          />
        </div>
        @if (email.invalid && email.touched) {
          <span class="field__error">{{ emailError }}</span>
        }
      </div>

      <!-- Password -->
      <div class="field" [class.field--error]="password.invalid && password.touched">
        <label class="field__label" for="password">Password</label>
        <div class="field__input-wrap">
          <span class="field__icon">🔒</span>
          <input
            id="password"
            class="field__input"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
        @if (password.invalid && password.touched) {
          <span class="field__error">{{ passwordError }}</span>
        }
      </div>

      <!-- Forgot password -->
      <div class="forgot">
        <span class="forgot__link">Forgot password?</span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="submit-btn"
        [class.submit-btn--loading]="loading()"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="submit-btn__spinner"></span>
          Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <!-- Divider -->
    <div class="divider">
      <div class="divider__line"></div>
      <span class="divider__text">or continue with</span>
      <div class="divider__line"></div>
    </div>

    <!-- Google -->
    <button class="google-btn" type="button" (click)="loginWithGoogle()">
      <svg class="google-btn__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Register link -->
    <p class="auth-link">
      Don't have an account?
      <span class="auth-link__action" (click)="goToRegister()">Create one</span>
    </p>

  </div>

</div>
