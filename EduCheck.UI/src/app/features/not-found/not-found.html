<div class="not-found">
  <div class="not-found__bg"></div>
  <div class="not-found__content">
    <div class="not-found__code">404</div>
    <h1 class="not-found__heading font-display">Page Not Found</h1>
    <p class="not-found__text">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="not-found__actions">
      <button class="btn-primary" (click)="goToSearch()">🔍 Go to Search</button>
      <button class="btn-ghost" (click)="goHome()">← Back to Home</button>
    </div>
  </div>
</div>
