# =============================================================================
# Nginx configuration for Angular SPA with HTTPS
# =============================================================================

# ---------------------------------------------------------------------------
# Run as non-root — matches the appuser created in the Dockerfile.
# ---------------------------------------------------------------------------
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Use /tmp for temp files so non-root user has write access.
    # -------------------------------------------------------------------------
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Performance: sendfile avoids copying data between kernel and user space.
    # tcp_nopush batches response headers with the first data chunk.
    # -------------------------------------------------------------------------
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # Gzip compression — reduces transfer size for text-based assets.
    # Images, videos, and already-compressed formats are excluded.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Hide Nginx version number from error pages and response headers.
    # -------------------------------------------------------------------------
    server_tokens off;

    # =========================================================================
    # HTTP Server - Redirect all traffic to HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name staging.educheck.org.za;
        
        # Redirect all HTTP requests to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # =========================================================================
    # HTTPS Server - Main application with SSL
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.educheck.org.za;
        
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # SSL Certificate Configuration
        # ---------------------------------------------------------------------
        ssl_certificate /etc/letsencrypt/live/staging.educheck.org.za/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.educheck.org.za/privkey.pem;
        
        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------------------------------------------------------------------
        # Security headers — applied to every response.
        # ---------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=()" always;

        # ---------------------------------------------------------------------
        # Angular HTML5 routing — all unknown paths serve index.html
        # so Angular's router handles navigation client-side.
        # Without this, refreshing on /search returns 404.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # index.html must NOT be cached — browsers must always fetch the
            # latest version so they pick up new JS/CSS hashes.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
        }

        # ---------------------------------------------------------------------
        # Hashed static assets (main.abc123.js, styles.def456.css, etc.)
        # can be cached aggressively — Angular changes the hash when content
        # changes, so browsers will always fetch new versions automatically.
        # ---------------------------------------------------------------------
        location ~* \.(js|css|woff|woff2|ttf|eot)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        # Images and other static assets — cache for 30 days.
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires     30d;
            add_header  Cache-Control "public";
            access_log  off;
        }

        # ---------------------------------------------------------------------
        # Block access to hidden files (e.g. .git, .env, .htaccess).
        # ---------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------------------------------------------------------------------
        # API Proxy — Forward /api requests to backend container
        # This allows frontend and backend to share the same domain, avoiding
        # CORS issues. The backend container is accessible via Docker network.
        # ---------------------------------------------------------------------
        location /api {
            proxy_pass http://educheck-api:5169;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts for API requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}