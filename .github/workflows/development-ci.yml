name: Develop Branch CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # Job 1: Backend Lint & Format Check
  # ===========================================================================
  lint:
    name: 🔍 Backend Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check code formatting
        run: dotnet format EduCheck.sln --verify-no-changes --verbosity diagnostic

  # ===========================================================================
  # Job 2: Frontend Lint
  # ===========================================================================
  frontend-lint:
    name: 🔍 Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: EduCheck.UI/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: EduCheck.UI

      - name: 🔍 Run ESLint
        run: npm run lint
        working-directory: EduCheck.UI

  # ===========================================================================
  # Job 3: Backend Build
  # ===========================================================================
  build:
    name: 🏗️ Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/net9.0/
            !**/obj/**
          retention-days: 1

  # ===========================================================================
  # Job 4: Frontend Build
  # ===========================================================================
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: EduCheck.UI/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: EduCheck.UI

      - name: 🏗️ Build Angular app (production)
        run: npm run build -- --configuration production
        working-directory: EduCheck.UI

  # ===========================================================================
  # Job 5: Unit Tests
  # ===========================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 🧪 Run unit tests
        run: |
          dotnet test EduCheck.Tests/EduCheck.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/Unit
          retention-days: 7

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./TestResults/Unit
          flags: unittests
          name: educheck-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ===========================================================================
  # Job 6: SAST - Static Application Security Testing
  # ===========================================================================
  sast:
    name: 🛡️ SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/csharp
            p/dotnet
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: 📤 Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ===========================================================================
  # Job 7: Secret Scanning
  # ===========================================================================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ===========================================================================
  # Job 8: Dependency Vulnerability Check
  # ===========================================================================
  dependency-check:
    name: 📦 Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check for vulnerable .NET packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "Critical\|High" vulnerability-report.txt; then
            echo "❌ Critical or High vulnerabilities found!"
            cat vulnerability-report.txt
            exit 1
          fi
          echo "✅ No critical .NET vulnerabilities found"

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: EduCheck.UI/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: EduCheck.UI

      - name: 🔍 Check for vulnerable npm packages
        run: |
          npm audit --audit-level=high 2>&1 | tee npm-vulnerability-report.txt || true
          if grep -q "critical\|high" npm-vulnerability-report.txt; then
            echo "❌ Critical or High npm vulnerabilities found!"
            cat npm-vulnerability-report.txt
            exit 1
          fi
          echo "✅ No critical npm vulnerabilities found"
        working-directory: EduCheck.UI

      - name: 📤 Upload vulnerability reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            vulnerability-report.txt
            EduCheck.UI/npm-vulnerability-report.txt
          retention-days: 7

  # ===========================================================================
  # Job 9: Integration Tests
  # Testcontainers spins up a real PostgreSQL container inside the runner.
  # ===========================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      checks: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 🐳 Verify Docker is available (required by Testcontainers)
        run: docker info

      - name: 🔗 Run integration tests
        run: |
          dotnet test EduCheck.IntegrationTests/EduCheck.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./TestResults/Integration
        env:
          DOTNET_ENVIRONMENT: Testing
          JWT_SECRET_KEY_TEST: ${{ secrets.JWT_SECRET_KEY_TEST }}

      - name: 📊 Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/Integration
          retention-days: 7

      - name: 📋 Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: ./TestResults/Integration/*.trx
          reporter: dotnet-trx
          fail-on-error: true
        continue-on-error: true

  # ===========================================================================
  # Job 10: Container Scanning — API + UI
  # Builds both Docker images and scans with Trivy.
  # Images are NOT pushed here — scan only.
  # ===========================================================================
  container-scan:
    name: 🐳 Container Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, frontend-build]
    permissions:
      security-events: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── API image ──────────────────────────────────────────
      - name: 🐳 Build API Docker image
        run: |
          docker build \
            --file EduCheck.API/Dockerfile \
            --tag educheck-api:${{ github.sha }} \
            .

      - name: 🔍 Trivy scan — API (fail on Critical/High)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: educheck-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: 📋 Trivy SARIF — API
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: educheck-api:${{ github.sha }}
          format: sarif
          output: trivy-api-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: 📦 SBOM — API
        uses: anchore/sbom-action@v0
        with:
          image: educheck-api:${{ github.sha }}
          artifact-name: sbom-api-${{ github.sha }}.spdx.json
          output-file: sbom-api.spdx.json

      # ── UI image ───────────────────────────────────────────
      - name: 🐳 Build UI Docker image
        run: |
          docker build \
            --file EduCheck.UI/Dockerfile \
            --tag educheck-ui:${{ github.sha }} \
            EduCheck.UI/

      - name: 🔍 Trivy scan — UI (fail on Critical/High)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: educheck-ui:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: 📋 Trivy SARIF — UI
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: educheck-ui:${{ github.sha }}
          format: sarif
          output: trivy-ui-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: 📦 SBOM — UI
        uses: anchore/sbom-action@v0
        with:
          image: educheck-ui:${{ github.sha }}
          artifact-name: sbom-ui-${{ github.sha }}.spdx.json
          output-file: sbom-ui.spdx.json

      # ── Upload all SARIF + SBOMs ───────────────────────────
      - name: 📤 Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api-results.sarif
        continue-on-error: true

      - name: 📤 Upload UI SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-ui-results.sarif
        continue-on-error: true

      - name: 📤 Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-develop
          path: |
            sbom-api.spdx.json
            sbom-ui.spdx.json
          retention-days: 30

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: ✅ Develop CI Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - frontend-lint
      - build
      - frontend-build
      - unit-tests
      - sast
      - secret-scan
      - dependency-check
      - integration-tests
      - container-scan
    if: success()

    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 Develop branch CI checks passed!"
          echo ""
          echo "✅ Backend Lint & Format   - Passed"
          echo "✅ Frontend Lint           - Passed"
          echo "✅ Backend Build           - Passed"
          echo "✅ Frontend Build          - Passed"
          echo "✅ Unit Tests              - Passed"
          echo "✅ SAST Security Scan      - Passed"
          echo "✅ Secret Scanning         - Passed"
          echo "✅ Dependency Check        - Passed"
          echo "✅ Integration Tests       - Passed"
          echo "✅ Container Scan (API+UI) - Passed"
          echo ""
          echo "📊 Code coverage uploaded to Codecov"
          echo "🔒 Security scans completed"
          echo "🐳 Both Docker images scanned — no Critical/High vulnerabilities"
          echo "📦 SBOMs generated for API and UI"