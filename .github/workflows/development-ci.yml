name: Develop Branch CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ===========================================================================
  # Job 1: Lint & Format Check
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check code formatting
        run: dotnet format EduCheck.sln --verify-no-changes --verbosity diagnostic

  # ===========================================================================
  # Job 2: Build
  # ===========================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/net9.0/
            !**/obj/**
          retention-days: 1

  # ===========================================================================
  # Job 3: Unit Tests
  # ===========================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 🧪 Run unit tests
        run: |
          dotnet test EduCheck.Tests/EduCheck.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/Unit
          retention-days: 7

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./TestResults/Unit
          flags: unittests
          name: educheck-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ===========================================================================
  # Job 4: SAST - Static Application Security Testing
  # ===========================================================================
  sast:
    name: 🛡️ SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/csharp
            p/dotnet
            p/owasp-top-ten
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: 📤 Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ===========================================================================
  # Job 5: Secret Scanning
  # ===========================================================================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ===========================================================================
  # Job 6: Dependency Vulnerability Check
  # ===========================================================================
  dependency-check:
    name: 📦 Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

          if grep -q "Critical\|High" vulnerability-report.txt; then
            echo "❌ Critical or High vulnerabilities found!"
            cat vulnerability-report.txt
            exit 1
          fi

          echo "✅ No critical vulnerabilities found"

      - name: 📤 Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vulnerability-report.txt
          retention-days: 7

  # ===========================================================================
  # Job 7: Integration Tests
  # Testcontainers spins up a real PostgreSQL container inside the runner.
  # No external DB or docker-compose.test.yml needed — Docker is available
  # on ubuntu-latest GitHub Actions runners out of the box.
  # ===========================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 🐳 Verify Docker is available (required by Testcontainers)
        run: docker info

      - name: 🔗 Run integration tests
        run: |
          dotnet test EduCheck.IntegrationTests/EduCheck.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./TestResults/Integration
        env:
          # Testcontainers uses the Docker socket — no extra config needed.
          # These env vars are picked up by EduCheckWebApplicationFactory.
          DOTNET_ENVIRONMENT: Testing
          JWT_SECRET_KEY_TEST: ${{ secrets.JWT_SECRET_KEY_TEST }}

      - name: 📊 Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/Integration
          retention-days: 7

      - name: 📋 Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: ./TestResults/Integration/*.trx
          reporter: dotnet-trx
          fail-on-error: true
        continue-on-error: true  # Informational only — don't block on reporter failures

  # ===========================================================================
  # Job 8: Container Scanning
  # Builds the API Docker image and scans it with Trivy.
  # Image is NOT pushed here — build and scan only.
  # Pushing happens in the main/release pipeline only.
  # ===========================================================================
  container-scan:
    name: 🐳 Container Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build API Docker image (scan only — not pushed)
        run: |
          docker build \
            --file EduCheck.API/Dockerfile \
            --tag educheck-api:${{ github.sha }} \
            .

      - name: 🔍 Run Trivy vulnerability scan (fail on Critical/High)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: educheck-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: 📋 Run Trivy scan (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: educheck-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: 📦 Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: educheck-api:${{ github.sha }}
          artifact-name: sbom-develop-${{ github.sha }}.spdx.json
          output-file: sbom.spdx.json

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-develop
          path: sbom.spdx.json
          retention-days: 30

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: ✅ Develop CI Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - unit-tests
      - sast
      - secret-scan
      - dependency-check
      - integration-tests
      - container-scan
    if: success()

    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 Develop branch CI checks passed!"
          echo ""
          echo "✅ Lint & Format         - Passed"
          echo "✅ Build                 - Passed"
          echo "✅ Unit Tests            - Passed"
          echo "✅ SAST Security Scan    - Passed"
          echo "✅ Secret Scanning       - Passed"
          echo "✅ Dependency Check      - Passed"
          echo "✅ Integration Tests     - Passed (72 tests)"
          echo "✅ Container Scan        - Passed"
          echo ""
          echo "📊 Code coverage uploaded to Codecov"
          echo "🔒 Security scans completed"
          echo "🐳 Docker image scanned — no Critical/High vulnerabilities"
          echo "📦 SBOM generated"