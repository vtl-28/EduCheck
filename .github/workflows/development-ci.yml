name: Develop Branch CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ===========================================================================
  # Job 1: Lint & Format Check
  # ===========================================================================
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check code formatting
        run: dotnet format EduCheck.sln --verify-no-changes --verbosity diagnostic

  # ===========================================================================
  # Job 2: Build
  # ===========================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/net9.0/
            !**/obj/**
          retention-days: 1

  # ===========================================================================
  # Job 3: Unit Tests
  # ===========================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🏗️ Build solution
        run: dotnet build EduCheck.sln --configuration Release --no-restore

      - name: 🧪 Run unit tests
        run: |
          dotnet test EduCheck.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always() && secrets.CODECOV_TOKEN != ''
        with:
          directory: ./TestResults
          flags: unittests
          name: educheck-coverage
          fail_ci_if_error: false  # Optional - won't block CI
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true  # Don't fail pipeline if Codecov not configured

      - name: 📊 Check code coverage threshold
        run: |
          echo "ℹ️ Code coverage threshold enforcement (70%) will be added in Phase 2"
          echo "📝 Current coverage reporting to Codecov"

  # ===========================================================================
  # Job 4: SAST - Static Application Security Testing
  # ===========================================================================
  sast:
    name: 🛡️ SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/csharp
            p/dotnet
            p/owasp-top-ten
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: 📤 Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ===========================================================================
  # Job 5: Secret Scanning
  # ===========================================================================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ===========================================================================
  # Job 6: Dependency Vulnerability Check
  # ===========================================================================
  dependency-check:
    name: 📦 Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore EduCheck.sln

      - name: 🔍 Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          
          # Fail if critical/high vulnerabilities found
          if grep -q "Critical\|High" vulnerability-report.txt; then
            echo "❌ Critical or High vulnerabilities found!"
            cat vulnerability-report.txt
            exit 1
          fi
          
          echo "✅ No critical vulnerabilities found"

      - name: 📤 Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vulnerability-report.txt
          retention-days: 7

  # ===========================================================================
  # Job 7: Integration Tests Placeholder (Phase 2)
  # ===========================================================================
  integration-tests-placeholder:
    name: ⏳ Integration Tests (Phase 2)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📝 Placeholder for Phase 2
        run: |
          echo "⏳ Integration tests will be added in Phase 2"
          echo ""
          echo "📋 Planned additions:"
          echo "  - Create EduCheck.IntegrationTests project"
          echo "  - Add docker-compose.test.yml for test database"
          echo "  - Test API endpoints with real database"
          echo "  - Test authentication flows"
          echo "  - Test database migrations"
          echo "  - Test security middleware"
          echo ""
          echo "✅ This is a placeholder - pipeline continues"

  # ===========================================================================
  # Job 8: Container Scanning Placeholder (Phase 2)
  # ===========================================================================
  container-scan-placeholder:
    name: ⏳ Container Scanning (Phase 2)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📝 Placeholder for Phase 2
        run: |
          echo "⏳ Container scanning will be added in Phase 2"
          echo ""
          echo "📋 Planned additions:"
          echo "  - Build Docker image for API"
          echo "  - Scan with Trivy for vulnerabilities"
          echo "  - Generate SBOM with Syft"
          echo "  - Check image size and layers"
          echo ""
          echo "✅ This is a placeholder - pipeline continues"

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: ✅ Develop CI Success (Phase 1)
    runs-on: ubuntu-latest
    needs: 
      - lint
      - build
      - unit-tests
      - sast
      - secret-scan
      - dependency-check
      - integration-tests-placeholder
      - container-scan-placeholder
    if: success()

    steps:
      - name: ✅ All checks passed
        run: |
          echo "🎉 Develop branch CI checks passed (Phase 1)!"
          echo ""
          echo "✅ Lint & Format - Passed"
          echo "✅ Build - Passed"
          echo "✅ Unit Tests - Passed"
          echo "✅ SAST Security Scan - Passed"
          echo "✅ Secret Scanning - Passed"
          echo "✅ Dependency Check - Passed"
          echo ""
          echo "⏳ Phase 2 will add:"
          echo "   • Integration tests with test database"
          echo "   • Docker container scanning"
          echo "   • SBOM generation"
          echo ""
          echo "📊 Code coverage uploaded to Codecov"
          echo "🔒 Security scans completed"