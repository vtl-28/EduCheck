# Prometheus Configuration
# Metrics collection and storage

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'educheck-monitor'

# Alertmanager configuration (for future use)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (for future use)
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # EduCheck API metrics
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['educheck-api:8889']
    metrics_path: '/metrics'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # OTel Collector metrics
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

# Enable remote write receiver (for OTel Collector)
remote_write: []

# Enable features for remote write receiver
# This is set via command line flags in docker-compose